<body class="auth-gradient-bg">

  <main class="flex items-center justify-center min-h-screen p-4">
    <div class="w-full max-w-md">
      <!-- Logo Section -->
      <div class="text-center mb-8">
        <a href="index.html" class="inline-flex items-center space-x-2">
          <img src="assets/img/logo.png" alt="Logo" class="h-8">
          <span class="text-white text-xl font-semibold">NiceAdmin</span>
        </a>
      </div>

      <!-- Auth Card -->
      <div class="auth-card p-8">
        <!-- Header -->
        <div class="text-center mb-8">
          <div class="mb-4">
            <i class="bi bi-key text-5xl text-gray-400"></i>
          </div>
          <h1 class="text-2xl font-bold text-gray-800 mb-2">Forgot Password?</h1>
          <p class="text-gray-600">Enter your email to reset your password</p>
        </div>

        <!-- Forgot Password Form -->
        <form class="space-y-6 needs-validation" novalidate>
          
          <!-- Email Field -->
          <div>
            <label for="email" class="block text-sm font-semibold text-gray-700 mb-2">
              <i class="bi bi-envelope mr-1"></i>
              Email Address
            </label>
            <input 
              type="email" 
              name="email" 
              id="email" 
              class="auth-input form-control" 
              placeholder="Enter your email address" 
              required
            >
            <div class="invalid-feedback">Please enter a valid email address!</div>
          </div>

          <!-- Submit Button -->
          <button type="submit" class="auth-button">
            <i class="bi bi-send mr-2"></i>
            Send Password Reset Link
          </button>

          <!-- Links -->
          <div class="text-center">
            <p class="text-sm text-gray-600">
              Remember your password? 
              <a href="pages-login.html" class="auth-link font-semibold">
                <i class="bi bi-arrow-left mr-1"></i>
                Back to Login
              </a>
            </p>
          </div>
        </form>
      </div>

      <!-- Footer -->
      <div class="text-center mt-8">
        <p class="text-white text-sm opacity-75">
          Designed by <a href="https://bootstrapmade.com/" class="text-white underline">BootstrapMade</a>
        </p>
      </div>
    </div>
  </main>

  <a href="#" class="fixed bottom-4 right-4 bg-primary-600 text-white p-3 rounded-full shadow-lg hover:bg-primary-700 transition-colors" title="Back to top">
    <i class="bi bi-arrow-up-short text-xl"></i>
  </a>

  <!-- Form Validation Script -->
  <script>
    // Bootstrap-style form validation for Tailwind
    (function() {
      'use strict';
      
      // Fetch all the forms we want to apply custom Bootstrap validation styles to
      var forms = document.querySelectorAll('.needs-validation');
      
      // Loop over them and prevent submission
      Array.prototype.slice.call(forms).forEach(function(form) {
        form.addEventListener('submit', function(event) {
          event.preventDefault();
          event.stopPropagation();
          
          var isValid = true;
          var inputs = form.querySelectorAll('input[required]');
          
          inputs.forEach(function(input) {
            var feedback = input.parentNode.querySelector('.invalid-feedback') || 
                          input.parentNode.parentNode.querySelector('.invalid-feedback');
            
            if (!input.checkValidity()) {
              input.classList.add('error');
              if (feedback) feedback.style.display = 'block';
              isValid = false;
            } else {
              input.classList.remove('error');
              if (feedback) feedback.style.display = 'none';
            }
          });
          
          if (isValid) {
            // Here you would normally submit the form
            console.log('Form is valid, would submit now');
            // Show success message
            alert('Password reset link would be sent to your email!');
          }
          
          form.classList.add('was-validated');
        }, false);
      });
    })();
  </script>

</body>
